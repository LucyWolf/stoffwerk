# Einstellungen für die Doppelklick-Installer (Vorlage: LucyWolf/double-click-installer).
# Der Workflow installer.yml baut daraus bei jedem Release die Linux-Installer und die setup.exe.

APP_NAME="Stoffwerk"
APP_ID="stoffwerk"
APP_COMMENT="Kleidung fuer VRChat-Avatare: Schnittmuster zeichnen, naehen, simulieren, exportieren"

# --- Linux ---
LINUX_FILE="stoffwerk-linux"
# Grafik über Vulkan; die Bibliotheken lädt das Programm erst beim Start
PKGS_ARCH="vulkan-icd-loader libxkbcommon-x11"
PKGS_DEB="libvulkan1 libxkbcommon-x11-0"
PKGS_RPM="vulkan-loader libxkbcommon-x11"
PKGS_SUSE="libvulkan1 libxkbcommon-x11-0"

# --- Windows ---
WINDOWS_FILE="Stoffwerk.exe"

# --- Icon ---
ICON_PNG="icon.png"
ICON_ICO="icon.ico"
