[package]
name = "stoffwerk"
version = "0.1.0"
edition = "2024"
description = "Kleidung für VRChat-Avatare: Schnittmuster zeichnen, nähen, simulieren, exportieren"
license = "MIT"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["wgpu", "wayland", "x11", "default_fonts"] }
glam = { version = "0.34", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
gltf = { version = "1.4", features = ["KHR_materials_unlit", "extras", "names", "utils", "import"] }
tobj = "4"
rfd = "0.18"
anyhow = "1"
log = "0.4"
env_logger = "0.11"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
strip = true
