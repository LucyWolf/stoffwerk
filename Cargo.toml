[package]
name = "stoffwerk"
version = "0.1.9"
edition = "2024"
description = "Kleidung für VRChat-Avatare: Schnittmuster zeichnen, nähen, simulieren, exportieren"
license = "MIT"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["wgpu", "wayland", "x11", "default_fonts"] }
glam = { version = "0.34", features = ["bytemuck", "serde"] }
bytemuck = { version = "1", features = ["derive"] }
gltf = { version = "1.4", features = ["KHR_materials_unlit", "extras", "names", "utils", "import"] }
tobj = "4"
ufbx = "0.11"
image = "0.25"
psd = "0.3"
roxmltree = "0.20"
spade = "2"
rayon = "1"
openusd = "0.9"
ogawa-rs = "0.4"
rfd = "0.18"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"

[profile.dev]
# Spart mehrere GB im target-Ordner; für Fehlermeldungen mit Zeilennummern reicht das
debug = "line-tables-only"
# Die Simulation ist ohne Optimierung zehnmal zu langsam zum Ausprobieren
opt-level = 1
incremental = false

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
lto = "thin"
strip = true
